[package]
name = "pqb"
version = "0.1.4"

categories = ["database"]
description = "A PostgreSQL Query Builder"
keywords = ["database", "postgres", "postgresql", "sql"]

edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
postgres = [
  "dep:postgres-types",
  "dep:postgres-protocol",
  "dep:bytes",
  "rust_decimal?/db-postgres",
]
sqlx = ["dep:sqlx"]
with-chrono = ["dep:chrono", "postgres-types?/with-chrono-0_4", "sqlx?/chrono"]
with-json = [
  "dep:serde_json",
  "postgres-types?/with-serde_json-1",
  "sqlx?/json",
]
with-rust_decimal = ["dep:rust_decimal", "sqlx?/rust_decimal"]
with-uuid = ["dep:uuid", "postgres-types?/with-uuid-1", "sqlx?/uuid"]

[dependencies]
bytes = { workspace = true, optional = true }
chrono = { version = "0.4", default-features = false, features = [
  "std",
], optional = true }
postgres-protocol = { version = "0.6", optional = true }
postgres-types = { version = "0.2", optional = true }
rust_decimal = { version = "1", default-features = false, features = [
  "std",
], optional = true }
serde_json = { version = "1", default-features = false, optional = true, features = [
  "std",
] }
sqlx = { workspace = true, optional = true }
uuid = { version = "1", default-features = false, optional = true }

[dev-dependencies]
insta = { version = "1.46.3" }
pg_query = { version = "6.1.1" }
tokio-postgres.workspace = true

[lints]
workspace = true
